# BOND-API Configuration — the frozen mission protocol contract for the BOND film suite
# This file is the meta-artifact linking manuscript prose to the execution layer.
# It is loaded by `src/bond_api/manuscript_variables.py::load_manuscript_config`
# and hydrated into `{{TOKEN}}`s by `scripts/z_generate_manuscript_variables.py`.

# Consumed by: `src/bond_api/manuscript_variables.py` and rendering tooling
paper:
  # RASP Standard: Title must be descriptive and objective
  title: "BOND-API: The Frozen Mission Protocol Contract for the BOND Film Suite"
  subtitle: "Layer 1 — protocol, discovery, registry, and serialization"
  version: "0.1.0"
  date: "2026-08-04"

# Consumed by: `infrastructure.publishing.extract_publication_metadata`
authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

# Consumed by: `infrastructure.publishing.publish_to_zenodo`
publication:
  github_repository: "docxology/bond-api"
  repository_url: "https://github.com/docxology/bond-api"
  journal: "BOND Suite Technical Series"
  year: "2026"

keywords:
  - "mission protocol"
  - "frozen contract"
  - "film agents"
  - "deterministic serialization"
  - "plugin discovery"
  - "reproducible research"

metadata:
  license: "MIT"
  language: "en"

# Render format toggles — gate per-renderer in infrastructure/rendering/pipeline.py.
render:
  formats:
    pdf: true
    html: true
    slides: true
    docx: false
    epub: false

# Consumed by: `infrastructure/reporting/pipeline_report_model.py` and CI/CD gates
# ZERO-MOCK TOLERANCE: Any failure blocks manuscript rendering
testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0

# Protocol parameters — read by `src/bond_api/manuscript_variables.py`.
# `serialization_tag` is the declared value; the live value comes from
# `bond_api.serialization.SERIALIZATION_TAG` and the two are pinned together by
# `tests/test_manuscript_variables.py::test_config_serialization_tag_matches_code`.
protocol:
  identity: "BOND-API"
  codename: "THE PROTOCOL"
  reference_film: "sable"
  serialization_tag: "__bond_type__"
  # Number of BOND film packages that implement this contract (suite roster).
  film_count: 27
