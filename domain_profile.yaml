domain: protocol_engineering
display_name: BOND-API — Frozen Mission Protocol Contract
required_packages:
  - pyyaml
  - pytest
preferred_outputs:
  - pdf
  - html
validation_gates:
  - coverage_floor
  - zero_mock
  - ruff_mypy
  - manuscript_token_hydration
  - discovery_conformance
figure_types: []
citation_policy: official_or_scholarly
source_policy: "Prefer primary project outputs: src/bond_api/, films/, tests/, and manuscript/config.yaml."
review_gates:
  - coverage_floor
  - zero_mock
  - manuscript_token_hydration
artifact_expectations:
  - output/data/manuscript_variables.json
  - output/manuscript/00_abstract.md
  - output/manuscript/03_results.md
benchmark_rubric:
  name: bond-api-protocol-readiness
  dimensions:
    - name: protocol_completeness
      weight: 2.0
    - name: round_trip_fidelity
      weight: 2.0
    - name: discovery_coverage
      weight: 1.0
    - name: zero_mock
      weight: 1.0
    - name: determinism
      weight: 1.0
llm_prompt_guidance: "Use the protocol surface (protocol_surface), test evidence, and manuscript variables as the evidence source; do not invent numeric results."
